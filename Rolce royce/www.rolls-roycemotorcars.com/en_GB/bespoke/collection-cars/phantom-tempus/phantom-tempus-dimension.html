        if (currentUrl && Object.keys(environmentMappings).length > 0) {
            for (var env in environmentMappings) {
                if (currentUrl.indexOf(env) !== -1) {
                    sysEnvChecker = environmentMappings[env];
                    break;
                }
            }
        }
        // handle both normal urls - https://www.rolls-roycemotorcars.com/en_GB/boutique/lifestyle-collections.html
        // and dealers - https://www.rolls-roycemotorcars.com/london/en_GB/showroom.html
        // need to swap dealers to have the location i.e london after the market for tracking
        var urlPastMarketCode = simpleCurrentUrl.split("en_GB")[1];

        if (rrmc_is_dealer_page) {
            var splitUrl = simpleCurrentUrl.split('https://www.rolls-roycemotorcars.com/');

            urlPastMarketCode = 'https://www.rolls-roycemotorcars.com/';

        var urlDivided = urlPastMarketCode.split('https://www.rolls-roycemotorcars.com/');

            fueltype = 'P';
        }
        if (fueltype === 'Electric') {
            fueltype = 'E';
        }
        var vehicle = castNAtoRRMC("");


        var pageData = {
            'event': "aem page loaded",

            'reference': {
                'linkedProducts': [

            'page': {

                    'language': pageLanguage,

                        ]

                    'pageType': pageType.length !== 0 ? pageType : 'content',

                    'subCategory3': urlDivided.length > 3 ? urlDivided[3] : '',

                    'pageTitle': pageTitle,
                    'timeStamp': window.rrTimestampedDate,
                    'brand': 'rolls-royce',

                        'bodyType': wheelbase,
                        'fuelType': fueltype,
                        'series': 'rrmc',

                    },

                        'productType': 'new vehicle',
                        'primaryCategory': 'new car',
                        'subCategory1': modelName,
                    },
                    'productInfo' : {
                        'productID': vehicle,
                        'manufacturer': 'rolls-royce',
                    }
                }
                },
            }),

			<audio id="RR_Doors_open" style="display:none" controls src="https://www.rolls-roycemotorcars.com/etc.clientlibs/rrmc/clientlibs/clientlib-components/resources/tempus_v1/sounds/RR_Doors_open.mp3"></audio>
			<audio id="RR_Paint_VO" style="display:none" controls src="https://www.rolls-roycemotorcars.com/etc.clientlibs/rrmc/clientlibs/clientlib-components/resources/tempus_v1/sounds/RR_Paint_VO.mp3"></audio>
			<audio id="RR_SOE_VO" style="display:none" controls src="https://www.rolls-roycemotorcars.com/etc.clientlibs/rrmc/clientlibs/clientlib-components/resources/tempus_v1/sounds/RR_SOE_VO.mp3"></audio>
		</div>


	<script>
		/* =======  audio   ======== */

		var audioObj;
		function audioSetUp(action){
			return;
			if(action.indexOf("panorotate")>-1){
				// need to load the audios
				document.getElementById("RR_headliner_VO").load();
				document.getElementById("RR_flowoftime_VO").load();
				document.getElementById("RR_gallery_VO").load();

				document.getElementById("RR_Wheel_VO").load();
				document.getElementById("RR_Doors_open").load();
				document.getElementById("RR_Paint_VO").load();
				document.getElementById("RR_SOE_VO").load();


			}

		}

		function audioSetUpAuto(){

			// need to load the audios
			document.getElementById("RR_headliner_VO").load();
			document.getElementById("RR_flowoftime_VO").load();
			document.getElementById("RR_gallery_VO").load();

			document.getElementById("RR_Wheel_VO").load();
			document.getElementById("RR_Doors_open").load();
			document.getElementById("RR_Paint_VO").load();
			document.getElementById("RR_SOE_VO").load();
		}

		function vrAudioPlay(audioid){
			return;
			if(audioObj!=null){vrAudioStop()}
			if(audioid.indexOf(".mp3")>-1){
				audioid=audioid.replace('.mp3','');
			}
			audioObj = document.getElementById(audioid);
			if(audioObj!=null) audioObj.play();

		}

		function vrAudioStop(){
			return;
			if(audioObj!=null){
				audioObj.pause();
				audioObj.currentTime = 0;
				audioObj=null;
			}
		}




		var noSleep = new NoSleep();
		var ad_md = new MobileDetect(window.navigator.userAgent);
		var ad_oculus = false;
		var ad_w = window.innerWidth;
		var ad_h = window.innerHeight;
		var ad_current_orientation;
		var ad_insta = false;

		ua = navigator.userAgent.toLowerCase();
		if (ua.match(/(instagram)/)){ad_insta=true;}


		if (ad_w>ad_h ) {
			// oculus detection to avoid vertical2landscape sign
			if (ua.match(/(oculusbrowser)/)){
				ad_oculus = true;
				//alert("oculus");
				document.getElementById("ad-menu-space").style.height = "12%";
			}
			ad_current_orientation = "horizontal";
			document.getElementById("ad-menu-space").style.paddingTop = "1%";
		}else{
			ad_current_orientation = "vertical";
			document.getElementById("ad-menu-space").style.paddingTop = "5%";
		}



		//   PANO INTEGRATION, PLATFORM DETECTION
		var krpanoObj = null;
		var ad_initLoaded = null;
		var ad_platform = ad_md.mobile();
		var ad_isIpad=null;

		if (navigator.userAgent.match(/(iPad)/) /* iOS pre 13 */ || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1 && ad_platform === null ) /* iPad OS 13 */)
		{
			ad_platform="tablet";
			ad_isIpad = true;

		}


		//if(!ad_platform) {ad_xmlFile = "initdesktop.xml"}
		ad_xmlFile = "https://www.rolls-roycemotorcars.com/etc.clientlibs/rrmc/clientlibs/clientlib-components/resources/tempus_v1/tempusinit.xml";
		embedpano({swf:"/etc.clientlibs/rrmc/clientlibs/clientlib-components/resources/tempus_v1/tempus.swf", xml:ad_xmlFile, target:"pano", html5:"auto", mobilescale:1.0, passQueryParameters:true, onready:krpano_onready_callback,
			initvars:{TEMPUS_VIDEOS:"/content/dam/rrmc/marketUK/rollsroycemotorcars_com/4-0-5-phantom-tempus/player"}
		});

		//embedpano({swf:"tempus.swf", xml:"tempus.xml", target:"pano", html5:"auto", mobilescale:1.0, passQueryParameters:true, onready:krpano_onready_callback});

		function krpano_onready_callback(krpano_interface)
		{
			krpanoObj = krpano_interface;

		}
		//

		//  ORIENTATION DETECTION ============================

		var ad_orientacion = (window.orientation);
		window.addEventListener('orientationchange', doOnOrientationChange);


		function doOnOrientationChange(){
			if (ad_oculus|ad_platform=="tablet") return;
			//if (!ad_initLoaded) return;
			ad_orientacion = (window.orientation);
			if (ad_orientacion == 0 || ad_orientacion == 180){
				// vertical
				ad_current_orientation = "vertical";
				document.getElementById("ad-menu-space").style.paddingTop = "5%";
				if (ad_initLoaded){

					if(krpanoObj.get("xml.scene") == "panorotate" || krpanoObj.get("xml.scene") == "launchselect" ){
						// launching firsst scene in same xml
						krpanoObj.call("loadscene(panoinit);");
					}else{
						if(krpanoObj.get("xml.scene") == "videopanovr") {krpanoObj.call("webvr.exitVR()");}
						krpanoObj.call("loadpanoscene(initimobile.xml,panoinit,null, IGNOREKEEP);");
						krpanoObj.call("set(plugin[skin_gyro].enabled,false)");
					}

				}
			}else{
				// horizontal
				//alert("horizontal");
				ad_current_orientation = "horizontal";
				document.getElementById("ad-menu-space").style.paddingTop = "1%";
				if ( krpanoObj.get("xml.scene") == "panorotate"){
						// push next scene of mobile

						krpanoObj.call("loadscene(launchselect, null, PRELOAD, COLORBLEND(1));");
						ad_initLoaded = true;
					}
				if (krpanoObj!=null && ad_initLoaded == null && ad_md.mobile==null ) {

					//krpanoObj.call("loadpano(initdesktop.xml, null, MERGE, BLEND(0.5));");
					ad_initLoaded = true;
				}

			}


		}

		//  charging here videopano for desktop, avoiding options for mobile / oculus / cardboard
		if (ad_md.mobile()==null ) {

			//krpanoObj.call("loadpano(initdesktop.xml, null, MERGE, BLEND(0.5));");
			ad_initLoaded = true;
		}

		//  show-hide cadbaord animation
		var ad_cardboard =  document.getElementById("ad-cardboard-notice");
		function showCardboardImage(){
			if (ad_md.os()=="AndroidOS"){document.getElementById("pano").classList.add("hideme");}
			ad_cardboard.classList.remove("hideme");
			ad_cardboard.addEventListener('click',function(){hideCardboardImage()});
		}

		function hideCardboardImage(){
			//hides the cardboard image and set the video
			if (ad_md.os()=="AndroidOS"){document.getElementById("pano").classList.remove("hideme");}
			ad_cardboard.classList.add("hideme");
			krpanoObj.call("initvideovr()");
		}




		//   END ORIENTATION DETECTION ===================

		//  HIDE/SHOW MENU IN LANDING ====================

		if (ad_platform != "tablet" && ad_platform != null) {showMenuInLanding();}
		function hideMenuInLanding(){
			document.getElementById("ad-menu-space").classList.add("hideme");
		}
		function showMenuInLanding(){
			document.getElementById("ad-menu-space").classList.remove("hideme");
		}
		function hideAnimMenuInLanding(){
			document.getElementById("ad-menu-space").classList.add("ad-menu-hide-anim");
		}

				//   BLENDING BCGND ===================

		function darkBg(){

		}

		function lightBg(){

		}

		audioSetUpAuto();
	</script>
