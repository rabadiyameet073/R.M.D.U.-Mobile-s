<!-- Advanced Filter & Sort Panel -->
<div class="filter-sort-container">
    <div class="filter-header">
        <h2>🔍 Filter & Sort Products</h2>
        <button class="filter-toggle-mobile" id="filterToggle">
            <span>☰ Filters</span>
        </button>
        <button class="filter-panel-close" id="filterPanelClose">×</button>
    </div>

    <div class="filter-controls-row">
        <!-- Search Bar -->
        <div class="filter-search">
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
                <path d="M416 208c0 45.9-14.9 88.3-40 122.7L502.6 457.4c12.5 12.5 12.5 32.8 0 45.3s-32.8 12.5-45.3 0L330.7 376c-34.4 25.2-76.8 40-122.7 40C93.1 416 0 322.9 0 208S93.1 0 208 0S416 93.1 416 208zM208 352a144 144 0 1 0 0-288 144 144 0 1 0 0 288z"/>
            </svg>
            <input type="text" id="advancedSearchInput" placeholder="Search by name, brand, model...">
        </div>

        <!-- Sort Dropdown -->
        <div class="filter-sort">
            <select id="sortSelect">
                <option value="price-low">Price: Low to High</option>
                <option value="price-high">Price: High to Low</option>
                <option value="name-asc">Name: A to Z</option>
                <option value="name-desc">Name: Z to A</option>
                <option value="newest">Newest First</option>
            </select>
        </div>

        <!-- Results Count -->
        <div class="results-count" id="resultsCount">
            Loading...
        </div>
    </div>

    <!-- Filter Panel -->
    <div class="filter-panel" id="filterPanel">
        <!-- Price Range Filter -->
        <div class="filter-group">
            <div class="filter-group-title">
                <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor">
                    <path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm0 18c-4.41 0-8-3.59-8-8s3.59-8 8-8 8 3.59 8 8-3.59 8-8 8zm.31-8.86c-1.77-.45-2.34-.94-2.34-1.67 0-.84.79-1.43 2.1-1.43 1.38 0 1.9.66 1.94 1.64h1.71c-.05-1.34-.87-2.57-2.49-2.97V5H10.9v1.69c-1.51.32-2.72 1.3-2.72 2.81 0 1.79 1.49 2.69 3.66 3.21 1.95.46 2.34 1.15 2.34 1.87 0 .53-.39 1.39-2.1 1.39-1.6 0-2.23-.72-2.32-1.64H8.04c.1 1.7 1.36 2.66 2.86 2.97V19h2.34v-1.67c1.52-.29 2.72-1.16 2.73-2.77-.01-2.2-1.9-2.96-3.66-3.42z"/>
                </svg>
                Price Range
            </div>
            <div class="filter-price-options">
                <div class="filter-price-option active" data-price-range="all">All Prices</div>
                <div class="filter-price-option" data-price-range="under-10k">Under ₹10,000</div>
                <div class="filter-price-option" data-price-range="10k-20k">₹10,000 - ₹20,000</div>
                <div class="filter-price-option" data-price-range="20k-30k">₹20,000 - ₹30,000</div>
                <div class="filter-price-option" data-price-range="30k-40k">₹30,000 - ₹40,000</div>
                <div class="filter-price-option" data-price-range="40k-50k">₹40,000 - ₹50,000</div>
                <div class="filter-price-option" data-price-range="50k-plus">₹50,000+</div>
            </div>
        </div>

        <!-- Brand Filter -->
        <div class="filter-group">
            <div class="filter-group-title">
                <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor">
                    <path d="M12.5 6.9c1.78 0 2.44.85 2.5 2.1h2.21c-.07-1.72-1.12-3.3-3.21-3.81V3h-3v2.16c-.53.12-1.03.3-1.48.54l1.47 1.47c.41-.17.91-.27 1.51-.27zM5.33 4.06L4.06 5.33 7.5 8.77c0 2.08 1.56 3.21 3.91 3.91l3.51 3.51c-.34.48-1.05.91-2.42.91-2.06 0-2.87-.92-2.98-2.1h-2.2c.12 2.19 1.76 3.42 3.68 3.83V21h3v-2.15c.96-.18 1.82-.55 2.45-1.12l2.22 2.22 1.27-1.27L5.33 4.06z"/>
                </svg>
                Brand
            </div>
            <div class="filter-checkbox-list">
                <div class="filter-checkbox-item">
                    <input type="checkbox" class="filter-brand-option" id="brand-samsung" value="Samsung">
                    <label for="brand-samsung">Samsung</label>
                </div>
                <div class="filter-checkbox-item">
                    <input type="checkbox" class="filter-brand-option" id="brand-apple" value="Apple">
                    <label for="brand-apple">Apple</label>
                </div>
                <div class="filter-checkbox-item">
                    <input type="checkbox" class="filter-brand-option" id="brand-oneplus" value="OnePlus">
                    <label for="brand-oneplus">OnePlus</label>
                </div>
                <div class="filter-checkbox-item">
                    <input type="checkbox" class="filter-brand-option" id="brand-redmi" value="Redmi">
                    <label for="brand-redmi">Redmi</label>
                </div>
                <div class="filter-checkbox-item">
                    <input type="checkbox" class="filter-brand-option" id="brand-poco" value="POCO">
                    <label for="brand-poco">POCO</label>
                </div>
                <div class="filter-checkbox-item">
                    <input type="checkbox" class="filter-brand-option" id="brand-realme" value="Realme">
                    <label for="brand-realme">Realme</label>
                </div>
                <div class="filter-checkbox-item">
                    <input type="checkbox" class="filter-brand-option" id="brand-iqoo" value="iQOO">
                    <label for="brand-iqoo">iQOO</label>
                </div>
                <div class="filter-checkbox-item">
                    <input type="checkbox" class="filter-brand-option" id="brand-vivo" value="Vivo">
                    <label for="brand-vivo">Vivo</label>
                </div>
                <div class="filter-checkbox-item">
                    <input type="checkbox" class="filter-brand-option" id="brand-oppo" value="OPPO">
                    <label for="brand-oppo">OPPO</label>
                </div>
                <div class="filter-checkbox-item">
                    <input type="checkbox" class="filter-brand-option" id="brand-moto" value="Moto">
                    <label for="brand-moto">Motorola</label>
                </div>
            </div>
        </div>

        <!-- RAM Filter -->
        <div class="filter-group">
            <div class="filter-group-title">
                <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor">
                    <path d="M15 9H9c-.55 0-1 .45-1 1v12c0 .55.45 1 1 1h6c.55 0 1-.45 1-1V10c0-.55-.45-1-1-1zm-1 12h-4v-8h4v8z"/>
                    <path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm0 18c-4.41 0-8-3.59-8-8s3.59-8 8-8 8 3.59 8 8-3.59 8-8 8z"/>
                </svg>
                RAM
            </div>
            <div class="filter-checkbox-list">
                <div class="filter-checkbox-item">
                    <input type="checkbox" class="filter-ram-option" id="ram-4gb" value="4GB">
                    <label for="ram-4gb">4 GB</label>
                </div>
                <div class="filter-checkbox-item">
                    <input type="checkbox" class="filter-ram-option" id="ram-6gb" value="6GB">
                    <label for="ram-6gb">6 GB</label>
                </div>
                <div class="filter-checkbox-item">
                    <input type="checkbox" class="filter-ram-option" id="ram-8gb" value="8GB">
                    <label for="ram-8gb">8 GB</label>
                </div>
                <div class="filter-checkbox-item">
                    <input type="checkbox" class="filter-ram-option" id="ram-12gb" value="12GB">
                    <label for="ram-12gb">12 GB</label>
                </div>
                <div class="filter-checkbox-item">
                    <input type="checkbox" class="filter-ram-option" id="ram-16gb" value="16GB">
                    <label for="ram-16gb">16 GB</label>
                </div>
            </div>
        </div>

        <!-- Storage Filter -->
        <div class="filter-group">
            <div class="filter-group-title">
                <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor">
                    <path d="M20 6h-2.18c.11-.31.18-.65.18-1a2.996 2.996 0 0 0-5.5-1.65l-.5.67-.5-.68C10.96 2.54 10 2 9 2 7.34 2 6 3.34 6 5c0 .35.07.69.18 1H4c-1.11 0-1.99.89-1.99 2L2 19c0 1.11.89 2 2 2h16c1.11 0 2-.89 2-2V8c0-1.11-.89-2-2-2zm-5-2c.55 0 1 .45 1 1s-.45 1-1 1-1-.45-1-1 .45-1 1-1zM9 4c.55 0 1 .45 1 1s-.45 1-1 1-1-.45-1-1 .45-1 1-1zm11 15H4v-2h16v2zm0-5H4V8h5.08L7 10.83 8.62 12 11 8.76l1-1.36 1 1.36L15.38 12 17 10.83 14.92 8H20v6z"/>
                </svg>
                Storage
            </div>
            <div class="filter-checkbox-list">
                <div class="filter-checkbox-item">
                    <input type="checkbox" class="filter-storage-option" id="storage-64gb" value="64GB">
                    <label for="storage-64gb">64 GB</label>
                </div>
                <div class="filter-checkbox-item">
                    <input type="checkbox" class="filter-storage-option" id="storage-128gb" value="128GB">
                    <label for="storage-128gb">128 GB</label>
                </div>
                <div class="filter-checkbox-item">
                    <input type="checkbox" class="filter-storage-option" id="storage-256gb" value="256GB">
                    <label for="storage-256gb">256 GB</label>
                </div>
                <div class="filter-checkbox-item">
                    <input type="checkbox" class="filter-storage-option" id="storage-512gb" value="512GB">
                    <label for="storage-512gb">512 GB</label>
                </div>
                <div class="filter-checkbox-item">
                    <input type="checkbox" class="filter-storage-option" id="storage-1tb" value="1TB">
                    <label for="storage-1tb">1 TB</label>
                </div>
            </div>
        </div>

        <!-- Connectivity Filter -->
        <div class="filter-group">
            <div class="filter-group-title">
                <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor">
                    <path d="M1 9l2 2c4.97-4.97 13.03-4.97 18 0l2-2C16.93 2.93 7.07 2.93 1 9zm8 8l3 3 3-3c-1.65-1.66-4.34-1.66-6 0zm-4-4l2 2c2.76-2.76 7.24-2.76 10 0l2-2C15.14 9.14 8.87 9.14 5 13z"/>
                </svg>
                Connectivity
            </div>
            <div class="filter-checkbox-list">
                <div class="filter-checkbox-item">
                    <input type="checkbox" class="filter-connectivity-option" id="connectivity-5g" value="5G">
                    <label for="connectivity-5g">5G</label>
                </div>
                <div class="filter-checkbox-item">
                    <input type="checkbox" class="filter-connectivity-option" id="connectivity-4g" value="4G">
                    <label for="connectivity-4g">4G</label>
                </div>
            </div>
        </div>

        <!-- Clear Filters Button -->
        <div class="filter-group" style="grid-column: 1 / -1;">
            <button class="clear-filters-btn" id="clearFiltersBtn">
                Clear All Filters
            </button>
        </div>
    </div>
</div>
